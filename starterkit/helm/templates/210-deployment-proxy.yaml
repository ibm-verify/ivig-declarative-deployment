apiVersion: apps/v1
kind: Deployment
metadata:
  name: isvd-proxy
  namespace: {{ .Values.namespace }}
spec:
  selector:
    matchLabels:
      app: isvd-proxy
  template: 
    metadata:
      labels:
        app: isvd-proxy
    spec:
      # The name of the service account which has the required
      # capabilities enabled for the isvd container.
      serviceAccountName: isvd

      {{ if not .Values.isOpenShift }}# User and group information for the container.
      securityContext:
        runAsUser: {{ .Values.services.isvdproxy.user }}
        runAsGroup: {{ .Values.services.isvdproxy.group }}
        fsGroup: {{ .Values.services.isvdproxy.group }}{{end}}

      # We use a volume to store the configuration for the 
      # environment.
      volumes:
      - name: config-volume
        configMap:
          name: isvgimldap
      - name: data-volume
        persistentVolumeClaim:
          claimName: isvd-proxy-pvc

      imagePullSecrets:
      - name: regcred

      containers:
      - name: isvd-proxy
        image: {{ .Values.images.isvdproxy }}
        imagePullPolicy: IfNotPresent

        # The port on which the container will be listening.
        ports:
        - containerPort: {{ .Values.services.isvdproxy.ports.ldapsproxy }}

        # Environment definition.
        env:
        - name: YAML_CONFIG_FILE
          value: /var/isvd/config/proxy_config.yaml
        - name: TZ
          value: ":{{ .Values.timezone }}"
          
        # The configuration volume.
        volumeMounts:
        - name: config-volume
          mountPath: /var/isvd/config
        - name: data-volume
          mountPath: /var/isvd/data

        # The liveness, readiness and startup probes are used by
        # Kubernetes to monitor the health of the container.  Our 
        # health is governed by the health_check.sh script which is
        # provided by the container.
        livenessProbe:
          exec:
            command:
            - /sbin/health_check.sh 
            - livenessProbe
          initialDelaySeconds: {{ .Values.services.isvdproxy.probes.initialDelaySeconds }}
          periodSeconds: {{ .Values.services.isvdproxy.probes.periodSeconds }}

        readinessProbe:
          exec:
            command:
            - /sbin/health_check.sh
          initialDelaySeconds: {{ .Values.services.isvdproxy.probes.initialDelaySeconds }}
          periodSeconds: {{ .Values.services.isvdproxy.probes.periodSeconds }}

        startupProbe:
          exec:
            command:
            - /sbin/health_check.sh 
            - startupProbe
          initialDelaySeconds: {{ .Values.services.isvdproxy.probes.initialDelaySeconds }}
          periodSeconds: {{ .Values.services.isvdproxy.probes.periodSeconds }}
