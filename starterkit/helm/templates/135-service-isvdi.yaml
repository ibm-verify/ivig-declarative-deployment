apiVersion: v1
kind: Service
metadata:
  name: isvdi
  namespace: {{ .Values.namespace }}
  labels:
    app: isvdi
spec:
  selector:
    app: isvdi
  ports:
    - name: rmi
      port: {{ .Values.services.isvdi.ports.api }}
      protocol: TCP
    - name: object
      port: {{ .Values.services.isvdi.ports.object }}
      protocol: TCP
