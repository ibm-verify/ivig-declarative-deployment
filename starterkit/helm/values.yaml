# Default values for IVIGChart.
# This is a YAML-formatted file.

namespace: REPLACE_NAMESPACE
timezone: REPLACE_TIMEZONE
isOpenShift: false
fips: false
licenseType: REPLACE_LICENSE
clusterUrl: REPLACE_CLUSTER

images:
  busybox: busybox:1.36-musl
  isvgim: icr.io/isvg/identity-manager:11.0.0.0_IF1
  isvdi: icr.io/isvdi/verify-directory-integrator-dispatcher:10.0.0.2
  isvd: icr.io/isvd/verify-directory-server:10.0.3.0
  isvdproxy: icr.io/isvd/verify-directory-proxy:10.0.3.0_IF3
  isvdseed: icr.io/isvd/verify-directory-seed:10.0.3.0
  mq: icr.io/isvg/mq:9.4.0.7
  postgres: postgres:15.6-bookworm
  kuberbac: gcr.io/kubebuilder/kube-rbac-proxy:v0.16.0
  kubegres: icr.io/kubegres:1.19
  riskengine: icr.io/isvg/ivig-ae:11.0.0.0

storage:
  className: REPLACE_STORAGE
  mode: REPLACE_MODE
  volumes:
    isvd: 1Gi
    isvdproxy: 200Mi
    isvdi: 1Gi
    isvgimcustom: 500Mi
    mqlocal: 2Gi
    mqshare: 2Gi
    postgres: 1Gi
    riskengine: 10Gi

services:
  isvdi:
    ports:
      api: 1099
  isvd:
    auditlog: false
    group: 1000
    ports:
      ldaps: 9636
    probes:
      initialDelaySeconds: 30
      periodSeconds: 10
    rootSuffix: dc=ivig
    user: 1000
  isvdproxy:
    auditlog: false
    group: 1000
    ports:
      ldapsproxy: 9636
      node: 30636
    probes:
      initialDelaySeconds: 30
      periodSeconds: 10
    user: 1000
  isvgim:
    config:
      adminUITimeoutSeconds: 1800
      iscUITimeoutSeconds: 1800
      healthcheckHeartbeatInSecs: 30
      debugInitScripts: false
      minReadySeconds: 5
      replicas: 1
      libertyLogMaxFileSize: 20
      libertyLogMaxFiles: 10
    ports:
      https: 9443
      iiop: 30809
      iiops: 30402
      node: 30943
    probes:
      failureThreshold: 3
      initialDelaySeconds: 60
      periodSeconds: 10
      successThreshold: 1
      timeoutSeconds: 10
  mqlocal:
    group: 1001
    ports:
      mq: 1414
      console: 9444
    probes:
      failureThreshold: 3
      initialDelaySeconds: 30
      periodSeconds: 10
      successThreshold: 1
      timeoutSeconds: 10
    qmgr: ISVGQueueMgr
    user: app
  mqshare:
    group: 1001
    hostname: mqshare
    ports:
      mq: 1414
      console: 9443
    probes:
      failureThreshold: 3
      initialDelaySeconds: 20
      periodSeconds: 10
      successThreshold: 1
      timeoutSeconds: 10
    qmgr: ISVGQMgrShared
    user: app
  postgres:
    group: 999
    dbName: ivig
    ports:
      pg: 5432
      node: 30543
    user: 999
  riskengine:
    serviceAccount: ivigrisk
    user: 1001

