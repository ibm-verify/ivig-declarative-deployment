{{- if .Values.general.install.deployIsvdi }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: isvgimsdi
  namespace: {{ .Values.namespace }}
data:
{{ tpl (.Files.Glob "config/adapters/{*.yaml,*.sh}").AsConfig . | indent 2 }}
{{- $files := include "certs" (list . "{isvdi.pem,*.crt}") | .Files.Glob }}
{{- if gt (len $files) 0 }}
{{ $files.AsConfig | indent 2 }}
{{- end -}}
{{- end }}
