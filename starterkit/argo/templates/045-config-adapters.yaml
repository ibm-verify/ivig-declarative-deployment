apiVersion: v1
kind: ConfigMap
metadata:
  name: isvgimsdi
  namespace: {{ .Values.namespace }}
data:
{{ tpl (.Files.Glob "config/adapters/{*.yaml,*.sh}").AsConfig . | indent 2 }}
{{- $files := .Files.Glob "config/certs/{isvdi.pem,*.crt}" }}
{{- if gt (len $files) 0 }}
{{ $files.AsConfig | indent 2 }}
{{- end -}}
