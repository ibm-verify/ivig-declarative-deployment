#------------------------------------------------------
# Properties used for send email.
#------------------------------------------------------
#mail.transport.protocol -
#        Specifies the default Transport Protocol. The Session.getTransport() method
#        returns a Transport object that implements this protocol. The client can
#        override this property and explicitly specify the protocol by using
#        Session.getTransport(String protocol) method.
#mail.store.protocol -
#        Specifies the default Message Access Protocol. The Session.getStore()
#        method returns a Store object that implements this protocol. The client can
#        override this property and explicitly specify the protocol with the
#        Session.getStore(String protocol ) method.
#mail.host -
#        Specifies the default Mail server. The Store and Transport object's connect
#        methods use this property, if the protocol-specific host property is absent, to locate
#        the target host.
#mail.user -
#        Specifies the username to provide when connecting to a Mail server. The Store
#        and Transport object's connect methods use this property, if the protocol-specific
#        username property is absent, to obtain the username.
#mail.protocol.host - (Where protocol specifies a particular protocol)
#        Specifies the protocol-specific default Mail server. This overrides
#        the mail.host property.
#mail.protocol.user - (Where protocol specifies a particular protocol)
#        Specifies the protocol-specific default username for connecting to the Mail
#        server. This overrides the mail.user property.
#mail.from -
#        Specifies the return address of the current user. Used by the
#        InternetAddress.getLocalAddress method to specify the current user's email address.
#mail.replyTo -
#        Specifies an email address option to which the end user can reply in case the from address on ISVG is a noreply
#        Can take multiple values separated by comma
#mail.protocol.class - (Where protocol specifies a particular protocol)
#        Specifies the calss implementation of a given protocol
#mail.baseurl -
#        defines external web server address to load images and map links from
#mail.title -
#        defines the title the enrole email notification
#
# Example of a typical SMTP based system for sending mail.
#
#mail.transport.protocol=SMTP
#mail.SMTP.class=com.sun.mail.smtp.SMTPTransport
#mail.host=mail.mydomain.com
#mail.from=admin@mydomain.com
#mail.baseurl=http://www.mydomain.com
#
#Refer to http://java.sun.com/products/javamail/ for additional usage and providers available


# URL to ITIM Login, example: http://<host_name>:<port_number>.  By using this URL the user can
# log on ITIM.  The default value of the <host_name> is the host where ITIM installed, and the
# default value of the <port_number> is the WebSphere HTTP transport port used by the WebSphere
# server where ITIM is installed.  Note that these default values will be set during installation.
mail.baseurl={{ .Values.mail.baseurl }}

# Context for ITIM
mail.itim.context=/itim

# Context for the service center UI
mail.context.servicecenter=/itim/ui

# Context for the console UI
mail.context.console=/itim/console

# Context for the end user UI
mail.context.enduser=/itim/ui

# Mail From, example: admin@us.ibm.com
mail.from={{ .Values.mail.baseurl }}

# Mail Reply-to, example: mail.replyTo=user1@mydomain.com,user2@mydomain.com
# mail.replyTo=

# ITIM Post Office feature
# Maximum number of emails to be aggregated at one time for each individual email address / topic combination
# If there are more emails that this limit already stored by Post Office, the system will immediately process
#  the remaining emails, but send them in a separate aggregated email
mail.postoffice.aggregate.max.emails=1000

####################################################################
# Maximum number of recipient email addresses per topic to process at one time.
# The system will process the email addresses in batches based on this property value.
# The valid values for this property are 0 or a value > 0.
# The default value is 0, which indicates that for each topic, system will process all
# recipient email addresses at one time.
mail.postoffice.topic.recipients.batchSize=0

# ***** Host Information *****
# Protocol, example: SMTP
mail.transport.protocol=SMTP

# Class, example: mail.SMTP.class=com.sun.mail.smtp.SMTPTransport
mail.SMTP.class=com.sun.mail.smtp.SMTPTransport

# Host, example: 192.168.6.204
mail.host={{ .Values.mail.host }}

# mail.smtp.port={{ index .Values.mail "smtp.port" }}
# The following properties are introduced to support SMTP authentication while sending email
# notification.
# mail.smtp.starttls.enable enables TLS session with the mail server.
# mail.smtp.auth enables authentication with the mail server.
#        runConfig mail Test also depends on this setting to establish authenticated or non-authenticated
#        session to send mail
# mail.smtp.auth.user is the user id used by application to authenticate with the smtp server.
# mail.smtp.auth.password is the password for mail.smtp.auth.user.
mail.smtp.starttls.enable={{ index .Values.mail "smtp.starttls.enable" | default "false" }}
mail.smtp.auth={{ index .Values.mail "smtp.auth" | default "false" }}
mail.smtp.auth.user={{ index .Values.mail "smtp.auth.user" }}
# Please use starter/bin/changePasswords.sh script to set/change this password.
mail.smtp.auth.password=

###############################################################################
# The value of 'mail.notification.disabled' property if set to 'true',
# will disable the mail notification and no mails will be sent.
# The valid values for this property is 'true' and 'false'.
# The default value of the property is 'false'.
mail.notification.disabled=false

mail.authentication.type={{ index .Values.mail "authentication.type" | default "basic" }}
mail.javax.net.ssl.trustStorePassword=
mail.javax.net.ssl.trustStore=

## Email notifications for selected TODO activities by default automatically link to
## Identity Manager Service Center for the following  specified list of root processes:
## globalAccessBatchRequestName
## personAddProcessName
## personModifyProcessName
## personDeleteProcessName
## personSuspendProcessName
## personRestoreProcessName
## personTransferProcessName
## personSelfRegProcessName
## accountAddProcessName
## accountDeleteProcessName
## globalAccountModifyProcessName
## globalRequestAccessProcessName
## globalRemoveAccessProcessName
## globalAccessRequestBatchName
## processMultipleAccountsAccessRequestsName
## globalProvisionProcessName
##
## The customer can reroute the TODO activity to another product for selected root processes
## by using the following property:
##
## enrole.workflow.notification.<product_name>=<todo_activity_type>:[<root_process>,]+
##
## The root_process names must match the names in the built-in workflow definitions.
## The todo_activity_type value must match the TODO activity names in the workflow definitions.
## Supported TODO activities are: APPROVAL
## The supported target product values are:
##   console - for the administration console
##   enduser - for the self-service console
##   servicecenter - for the Identity Manager Service Center
## Example:
## To redirect the TODO activity link for the APPROVAL activity for the two specified root processes to the self-service console, the entry is:
## enrole.workflow.notification.servicecenter=APPROVAL:globalRequestAccessProcessName,globalRemoveAccessProcessName
## If the same entry appears in all three of target products, then the email routing precedence is 1. servicecenter. 2. enduser 3. console.
## The 'forcedurl' attribute used in ITIMURL token on email templates takes precedence over this property file.
## The 'forcedurl' attribute now also supports the value 'servicecenter' to force redirecting links to the Identity Manager Service Center

# ==============================================
# Email-based Approval Configuration
# ==============================================

# Set to true to enable email-based approval monitoring
mail.office365.monitoring.enabled={{ index .Values.office365 "monitoring.enabled" | default false }}

# Mailbox scan interval (in minutes, default = 30)
mail.office365.scan.interval.minutes={{ index .Values.office365 "scan.interval.minutes" | default 30 }}

# Office365 / Azure AD OAuth2 Setup / Register an app in Azure AD and provide values below
# ==============================================

# Office365 mailbox (User Principal Name/email) used for approval requests and responses
mail.office365.user={{ index .Values.office365 "user.id" }}

# Application (client) ID from your Azure AD app registration
mail.office365.client.id={{ index .Values.office365 "client.id" }}

# Client secret (application password) generated for the app registration
mail.office365.client.secret={{ index .Values.office365 "client.secret" }}

# Directory (tenant) ID of your Azure AD organization
mail.office365.tenant.id={{ index .Values.office365 "tenant.id" }}

# ===============================================
# Microsoft Graph API Endpoints - Default values will be used if not overridden

# Token endpoint template - %s will be replaced with tenant ID
mail.office365.graph.token.endpoint.template={{ index .Values.office365 "graph.token.endpoint" | default "https://login.microsoftonline.com/%s/oauth2/v2.0/token" }}

# Messages endpoint template - %s will be replaced with user principal name
mail.office365.graph.messages.endpoint={{ index .Values.office365 "graph.messages.endpoint" | default "https://graph.microsoft.com/v1.0/users/%s/mailFolders/inbox/messages" }}

# User-Agent header for HTTP requests to Microsoft Graph
mail.office365.graph.user.agent={{ index .Values.office365 "graph.user.agent" | default "IVIG-EmailApproval/1.0" }}
