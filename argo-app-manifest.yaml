apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ivig-argo
spec:
  destination:
    namespace: ivig-argo
    server: https://kubernetes.default.svc
  source:
    path: starter/argo
    repoURL: https://git.example.com/foobar/myproject.git
    targetRevision: develop
    helm:
      valueFiles:
        - values.yaml
        - values-config.yaml
      valuesObject: # insert the content of secrets.yaml for a dummy/DEV setup
      paramters:
        - name: revision
          value: $ARGO_APP_REVISION_SHORT
  project: integrator
