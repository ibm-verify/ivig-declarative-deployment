## enrole.scheduling.selectForUpdateRequired
## This property decides whether ISIM will use SELECT..FOR UPDATE statement
## while processing the scheduled messages. Please note that this property is applicable
## only for DB2 and Oracle database. If this property is set to true, then ISIM will use
## SELECT..FOR UPDATE statement which will ensure that the two scheduler threads do not
