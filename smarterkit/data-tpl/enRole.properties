# Value of this property specifies below details
#     1. Only the binary attributes specified below will be included in the
#        response of webservices api.(values element of WSAttribute complex type)
#     2. If isBase64Encoded is set to 1, the value will be returned as is in the
#        webservice response. If set to 0, the value will be Base64 encoded.
#
# The property value can be specified as <attributeName>:<isBase64Encoded>
# If isBase64Encoded is missing or not correctly specified then the attribute
# value is considered as not encoded.
# Multiple values can be seperated by white space.
# e.g. To include jpegphoto attribute value stored in Base64 encoded format,
# specify the attribute as follows
# enrole.webservices.binary.attributes=jpegphoto:1
# If jpegphoto attribute value is stored in raw format in LDAP, specify the
# attribute as follows
# enrole.webservices.binary.attributes=jpegphoto:0
# enrole.webservices.binary.attributes=

# Timeout value for webservices session  (min)
