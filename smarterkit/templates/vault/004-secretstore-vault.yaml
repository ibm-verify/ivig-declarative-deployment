{{- if (.Values.vault).server }}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: {{ $.Values.vault.secretStore | default "idm-vault-secret-store" }}
spec:
  provider:
    vault:
      auth:
        kubernetes:
          mountPath: kubernetes
          role: idm-app-role
          serviceAccountRef:
            name: idm-vault-viewer
            namespace: {{ .Values.namespace }}
        namespace: {{ .Values.vault.namespace }}
      server: {{ .Values.vault.server }}
      {{- if .Values.vault.caProvider }}
      caProvider: {{- .Values.vault.caProvider | toYaml | nindent 8 }}
      {{- end }}
      {{- if .Values.vault.namespace }}
      namespace: {{ .Values.vault.namespace | quote }}
      {{- end }}
      version: v2
{{- end }}
