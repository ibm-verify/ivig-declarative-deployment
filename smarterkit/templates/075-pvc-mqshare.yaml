apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mqshare-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes: [ "ReadWriteOnce" ]
  storageClassName: {{ .Values.storage.className }}
  resources:
    requests:
      storage: {{ .Values.storage.volumes.mqshare }}
