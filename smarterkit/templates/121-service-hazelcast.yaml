apiVersion: v1
kind: Service
metadata:
  name: hazelcast-headless
  namespace: {{ .Values.namespace }}
  labels:
    app: isvgim
    {{- include "extra" (list . "labels.service.hazelcast-headless" 4) }}
  annotations:
    {{- include "extra" (list . "annotations.service.hazelcast-headless" 4) }}
spec:
  clusterIP: None
  selector:
    app: isvgim
  ports:
    - name: hazelcast
      port: {{ .Values.services.isvgim.ports.hazelcast }}

